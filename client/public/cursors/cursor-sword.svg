<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Blade Gradients -->
    <linearGradient id="bladeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F9FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#CFD8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0BEC5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bladeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0BEC5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#90A4AE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#607D8B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gold/Guard Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFECB3;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFB300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6F00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFCA28;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFF8E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCA28;stop-opacity:1" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3E2723;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#5D4037;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6D4C41;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#5D4037;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
    </linearGradient>

    <!-- Gem Gradient -->
    <radialGradient id="gemGradient" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:#FF8A80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </radialGradient>

    <!-- Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Group for the whole sword to center it -->
  <g transform="translate(0, 0)">
    
    <!-- BLADE -->
    <!-- Left Facet -->
    <path d="M 256 40 L 226 340 L 256 340 Z" fill="url(#bladeLeft)" />
    <!-- Right Facet -->
    <path d="M 256 40 L 286 340 L 256 340 Z" fill="url(#bladeRight)" />
    <!-- Center Ridge Highlight -->
    <path d="M 256 40 L 256 340" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" />

    <!-- HANDLE / GRIP -->
    <rect x="244" y="360" width="24" height="90" rx="4" fill="url(#handleGradient)" filter="url(#dropShadow)" />
    <!-- Grip Texture (Leather wrapping) -->
    <path d="M 244 375 L 268 385 M 244 395 L 268 405 M 244 415 L 268 425 M 244 435 L 268 445" stroke="#3E2723" stroke-width="2" opacity="0.5" />

    <!-- GUARD (Cross-guard) -->
    <g filter="url(#dropShadow)">
      <!-- Main Guard Shape -->
      <path d="M 196 330 
               Q 220 320 236 340 
               L 276 340 
               Q 292 320 316 330 
               L 320 345 
               Q 290 360 256 370 
               Q 222 360 192 345 
               Z" 
            fill="url(#goldGradient)" stroke="#BF360C" stroke-width="1"/>
      
      <!-- Guard Detail/Highlight -->
      <path d="M 205 338 Q 230 335 240 350 L 272 350 Q 282 335 307 338" fill="none" stroke="url(#goldHighlight)" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- POMMEL -->
    <g filter="url(#dropShadow)">
      <circle cx="256" cy="460" r="20" fill="url(#goldGradient)" stroke="#BF360C" stroke-width="1"/>
      <circle cx="256" cy="460" r="14" fill="none" stroke="#B71C1C" stroke-width="2" opacity="0.3"/>
      <circle cx="256" cy="460" r="6" fill="url(#goldHighlight)"/>
    </g>

    <!-- CENTRAL GEM (On Guard) -->
    <polygon points="256,345 264,355 256,365 248,355" fill="url(#gemGradient)" stroke="#880E4F" stroke-width="1"/>
    
    <!-- Shine effect on Blade -->
    <path d="M 256 60 L 260 120 L 256 110 Z" fill="#FFFFFF" opacity="0.6" />
    
  </g>
</svg>
