<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g transform="rotate(45 256 256)">
    <!-- Handle (Modified to be a "stick" - rectangular with slight radius) -->
    <rect x="232" y="60" width="48" height="392" rx="4" fill="#8D6E63"/>
    
    <!-- Handle Shading (Right Half - Adjusted to match rectangular shape) -->
    <path d="M 256 60 L 276 60 A 4 4 0 0 1 280 64 L 280 448 A 4 4 0 0 1 276 452 L 256 452 Z" fill="#6D4C41"/>
    
    <!-- Axe Head Shadow on Handle -->
    <path d="M 232 180 L 280 180 L 280 210 Z" fill="#3E2723" opacity="0.2"/>
    
    <!-- Axe Head (Poll/Back) -->
    <rect x="192" y="100" width="60" height="80" rx="4" fill="#546E7A"/>
    
    <!-- Axe Head (Blade Body) -->
    <path d="M 240 100 L 370 60 C 400 60 400 220 370 220 L 240 180 Z" fill="#78909C"/>
    
    <!-- Axe Head (Cutting Edge) -->
    <path d="M 370 60 C 400 60 400 220 370 220 C 385 180 385 100 370 60 Z" fill="#CFD8DC"/>
    
    <!-- Binding/Detail at head connection -->
    <rect x="232" y="110" width="48" height="60" fill="#455A64" opacity="0.2"/>
